<!-- Global Confirmation Modal Component -->
<div x-data="{
         open: false,
         title: '',
         message: '',
         confirmText: 'Confirm',
         confirmClass: 'bg-red-700 hover:bg-red-800 text-white',
         iconClass: 'bg-red-50 text-red-700',
         confirmAction: null,
         previousFocus: null,
         focusableSelector: 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=&quot;-1&quot;])',
         focusFirst() {
             this.$nextTick(() => this.$refs.cancelButton?.focus());
         },
         close() {
             this.open = false;
             this.$nextTick(() => this.previousFocus?.focus?.());
         },
         trapFocus(event) {
             if (event.key !== 'Tab') return;
             const elements = Array.from(this.$refs.dialog.querySelectorAll(this.focusableSelector));
             if (!elements.length) return;
             const first = elements[0];
             const last = elements[elements.length - 1];
             if (event.shiftKey && document.activeElement === first) {
                 event.preventDefault();
                 last.focus();
             } else if (!event.shiftKey && document.activeElement === last) {
                 event.preventDefault();
                 first.focus();
             }
         },
         showConfirm(detail) {
             this.previousFocus = document.activeElement;
             this.title = detail.title || 'Confirm Action';
             this.message = detail.message || 'Are you sure you want to proceed?';
             this.confirmText = detail.confirmText || 'Confirm';
             this.confirmClass = detail.confirmClass || 'bg-red-700 hover:bg-red-800 text-white';
             this.iconClass = detail.iconClass || 'bg-red-50 text-red-700';
             this.confirmAction = () => {
                 const form = detail.formElement || (detail.formId ? document.getElementById(detail.formId) : null);
                 if (!form) return;
                 if (form.requestSubmit) {
                     form.requestSubmit();
                 } else {
                     form.submit();
                 }
             };
             this.open = true;
             this.focusFirst();
         }
     }"
     @confirm-modal.window="showConfirm($event.detail)"
     @keydown.escape.window="if (open) close()"
     x-cloak>
     
     <!-- Modal Background Overlay -->
     <div x-show="open" 
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-100"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0"
          class="fixed inset-0 bg-zinc-950/45 backdrop-blur-xs z-50 flex items-center justify-center p-4"
          @click="close()">
          
          <!-- Modal Card -->
          <div @click.stop
               x-ref="dialog"
               x-show="open"
               role="dialog"
               aria-modal="true"
               aria-labelledby="confirm-modal-title"
               aria-describedby="confirm-modal-message"
               tabindex="-1"
               @keydown="trapFocus($event)"
               x-transition:enter="transition ease-out duration-300"
               x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
               x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
               x-transition:leave="transition ease-in duration-200"
               x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
               x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
               class="bg-white border border-zinc-200/80 rounded-2xl shadow-2xl max-w-md w-full p-6 text-left space-y-4">
               
               <div class="flex items-start gap-4">
                   <div :class="'p-3 rounded-xl shrink-0 ' + iconClass">
                       <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                       </svg>
                   </div>
                   <div>
                       <h3 id="confirm-modal-title" class="text-base font-bold text-zinc-950" x-text="title">Confirm Action</h3>
                       <p id="confirm-modal-message" class="text-xs text-zinc-500 leading-relaxed mt-2" x-text="message"></p>
                   </div>
               </div>
               
               <div class="flex items-center justify-end gap-3 pt-4 border-t border-zinc-100">
                   <button type="button" x-ref="cancelButton" @click="close()"
                           class="px-4 py-2 border border-zinc-200 rounded-lg text-xs font-semibold text-zinc-700 bg-white hover:bg-zinc-50 transition-colors shadow-2xs cursor-pointer">
                       Cancel
                   </button>
                   <button type="button" @click="confirmAction(); close()"
                           :class="'ui-button inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold transition-all shadow-xs cursor-pointer ' + confirmClass">
                       <i class="fa-solid fa-check" aria-hidden="true"></i>
                       <span x-text="confirmText">Confirm</span>
                   </button>
               </div>
          </div>
     </div>
</div>
