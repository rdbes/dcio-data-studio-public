<dialog id="confirm-modal" data-confirm-dialog aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-message" class="confirm-dialog bg-white border border-zinc-200/80 rounded-2xl shadow-2xl p-6 text-left space-y-4">
    <div class="flex items-start gap-4">
        <div data-confirm-icon class="p-3 rounded-xl shrink-0 bg-red-50 text-red-700" aria-hidden="true">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
            <h2 id="confirm-modal-title" data-confirm-title class="text-base font-bold text-zinc-950">Confirm Action</h2>
            <p id="confirm-modal-message" data-confirm-message class="text-xs text-zinc-500 leading-relaxed mt-2"></p>
        </div>
    </div>
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-zinc-100">
        <button type="button" data-confirm-cancel autofocus class="px-4 py-2 border border-zinc-200 rounded-lg text-xs font-semibold text-zinc-700 bg-white hover:bg-zinc-50 cursor-pointer">Cancel</button>
        <button type="button" data-confirm-accept class="ui-button">
            <i class="fa-solid fa-check" aria-hidden="true"></i>
            <span data-confirm-label>Confirm</span>
        </button>
    </div>
</dialog>
