<!-- Floating Toast Notifications -->
<div id="toast-container" class="fixed top-24 right-6 z-50 space-y-3 pointer-events-none max-w-sm w-full" aria-live="polite" aria-atomic="false">
    {% if messages %}
        {% for message in messages %}
            {% if message.tags == 'success' or message.tags == 'info' %}
                <div data-dismissible-message role="status"
                     class="flex items-center justify-between p-4 rounded-xl text-xs font-semibold shadow-lg transition-all duration-200 pointer-events-auto text-left border backdrop-blur-xs
                            {% if message.tags == 'success' %}bg-green-50/95 text-green-900 border-green-200/60
                            {% else %}bg-blue-50/95 text-blue-900 border-blue-200/60{% endif %}">
                    <div class="flex items-center gap-3">
                        {% if message.tags == 'success' %}
                            <svg class="w-5 h-5 text-green-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        {% else %}
                            <svg class="w-5 h-5 text-blue-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        {% endif %}
                        <span>{{ message }}</span>
                    </div>
                    <button type="button" data-dismiss-message aria-label="Dismiss notification" class="p-1 rounded-md transition-colors ml-4
                                   {% if message.tags == 'success' %}text-green-400 hover:text-green-600 hover:bg-green-100/50
                                   {% else %}text-blue-400 hover:text-blue-600 hover:bg-blue-100/50{% endif %}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            {% endif %}
        {% endfor %}
    {% endif %}
</div>
