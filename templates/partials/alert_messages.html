{% if messages %}
    <div id="alert-container"
         x-data="{ hasVisibleChildren: true }"
         x-show="hasVisibleChildren"
         x-init="hasVisibleChildren = $el.querySelector('[x-data]') !== null"
         class="{{ wrapper_class|default:'mb-6 space-y-2' }}">
        {% for message in messages %}
            {% if message.tags == 'error' or message.tags == 'warning' %}
                <div x-data="{ show: true }"
                     x-show="show"
                     x-transition:leave="transition ease-in duration-300"
                     x-transition:leave-start="opacity-100 scale-100"
                     x-transition:leave-end="opacity-0 scale-95"
                     class="flex items-center justify-between p-4 rounded-lg border text-sm shadow-sm transition-all duration-200 text-left
                            {% if message.tags == 'error' %}bg-red-50/80 text-red-900 border-red-200/60
                            {% else %}bg-amber-50 text-amber-900 border-amber-200{% endif %}">
                    <div class="flex items-center gap-3">
                        {% if message.tags == 'error' %}
                            <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        {% else %}
                            <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        {% endif %}
                        <span class="font-medium">{{ message }}</span>
                    </div>
                    <button type="button" @click="show = false" aria-label="Dismiss message" class="p-1 rounded-md hover:bg-zinc-200/60 text-zinc-400 hover:text-zinc-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
