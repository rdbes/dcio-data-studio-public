{% if href %}
    <a href="{{ href }}" class="{{ classes }}"{% if title %} title="{{ title }}"{% endif %}{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}>
        {% if icon %}<i class="{{ icon }}" aria-hidden="true"></i>{% endif %}
        {{ label }}
    </a>
{% else %}
    <button
        type="{{ type }}"
        class="{{ classes }}"
        {% if form_id %}form="{{ form_id }}"{% endif %}
        {% if dialog_id %}data-dialog-open="{{ dialog_id }}"{% endif %}
        {% if disabled %}disabled aria-disabled="true"{% endif %}
        {% if title %}title="{{ title }}"{% endif %}
        {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
        {% if disabled_when %}:disabled="{{ disabled_when }}"{% endif %}
        {% if disabled_class_when %}:class="{{ disabled_class_when }}"{% endif %}
        {% if confirm_title %}
            data-confirm-title="{{ confirm_title }}"
            data-confirm-message="{{ confirm_message }}"
            data-confirm-text="{{ confirm_text|default:'Confirm' }}"
            data-confirm-class="{{ confirm_class }}"
            data-confirm-icon-class="{{ confirm_icon_class }}"
            data-confirm-form-id="{{ confirm_form_id }}"
        {% endif %}
        {% if scroll_target %}data-scroll-target="{{ scroll_target }}"{% endif %}
    >
        {% if loading_var %}
            <svg x-show="{{ loading_var }}" class="animate-spin h-4 w-4 text-current mr-2 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="display: none;">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span x-show="!{{ loading_var }}">{{ label }}</span>
            <span x-show="{{ loading_var }}" style="display: none;">{{ loading_label }}</span>
        {% else %}
            {% if icon %}<i class="{{ icon }}" aria-hidden="true"></i>{% endif %}
            {{ label }}
        {% endif %}
    </button>
{% endif %}
