{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="application-name" content="RRDBES Studio">
    <title>Sign in - RRDBES Studio</title>
    <link rel="icon" href="{% static 'img/dala-logo.png' %}?v=20260927-rrdbes-brand-v1" type="image/png">
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}?v=20260810-farm-strict-v3">
    <link rel="stylesheet" href="{% static 'vendor/fonts/inter/variable.css' %}?v=4.1">
    <link rel="stylesheet" href="{% static 'vendor/fonts/ibm-plex-mono/all.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20260927-login-neutral-v2">
</head>
<body class="login-page min-h-screen bg-zinc-50 text-zinc-900 flex items-center justify-center px-6">
    <main class="w-full max-w-sm">
        <div class="login-card bg-white border border-zinc-200 rounded-xl shadow-sm p-6" aria-labelledby="auth-title">
            <div class="mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 shrink-0 bg-zinc-950 flex items-center justify-center">
                        <img
                            src="{% static 'img/dala-logo-gray.png' %}?v=20260927-login-gray-logo-v2"
                            alt="RRDBES"
                            class="login-brand-logo h-full w-full object-cover"
                        >
                    </div>
                    <h1 id="auth-title" class="login-brand-wordmark" aria-label="RRDBES Studio">
                        <span class="login-brand-wordmark-primary">RRDBES</span>
                        <span class="login-brand-wordmark-secondary">Studio</span>
                    </h1>
                </div>
            </div>

            {% if form.errors %}
                <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">
                    Sign-in failed. Check your username and password.
                </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div>
                    <label for="{{ form.username.id_for_label }}" class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Email or username</label>
                    <input
                        id="{{ form.username.id_for_label }}"
                        name="{{ form.username.html_name }}"
                        type="text"
                        value="{{ form.username.value|default:'' }}"
                        autocomplete="username"
                        required
                        class="login-form-input w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm focus:outline-none"
                    >
                </div>

                <div>
                    <label for="{{ form.password.id_for_label }}" class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Password</label>
                    <input
                        id="{{ form.password.id_for_label }}"
                        name="{{ form.password.html_name }}"
                        type="password"
                        autocomplete="current-password"
                        required
                        class="login-form-input w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm focus:outline-none"
                    >
                </div>

                <button type="submit" class="login-submit w-full py-3">Sign in</button>
            </form>
        </div>
    </main>
</body>
</html>
